syntax = "proto3";

package worldmonitor.intelligence.v1;

import "buf/validate/validate.proto";
import "sebuf/http/annotations.proto";

// GetCountryIntelBriefRequest specifies which country to generate a brief for.
message GetCountryIntelBriefRequest {
  // ISO 3166-1 alpha-2 country code.
  string country_code = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.len = 2,
    (buf.validate.field).string.pattern = "^[A-Z]{2}$",
    (sebuf.http.query) = {name: "country_code"}
  ];
  // Optional analytical framework instructions to append to system prompt. Max 2000 chars enforced at handler level.
  string framework = 2 [(sebuf.http.query) = {name: "framework"}];
}

// BriefSource describes one article used to ground an AI-generated brief.
message BriefSource {
  // Source article headline.
  string title = 1;
  // Source outlet or feed label.
  string source = 2;
  // Absolute http(s) source article URL.
  string url = 3;
  // Article publication time, when available.
  string published_at = 4;
}

// BriefClaim is one validated sentence of a brief and what it cites.
message BriefClaim {
  // One factual sentence, without citation markers.
  string text = 1;
  // 1-based indexes into sources.
  repeated int32 source_indexes = 2;
  // Ids of cited evidence items (E1, E2, ...).
  repeated string evidence_ids = 3;
}

// BriefSection is one brief section with at least one surviving claim.
message BriefSection {
  // situation | implications | risks | outlook | watch
  string key = 1;
  // Display heading, e.g. KEY RISKS.
  string heading = 2;
  // Claims that passed citation-bound validation.
  repeated BriefClaim claims = 3;
}

// BriefEvidence is one World Monitor data point a claim may cite.
message BriefEvidence {
  // Stable id within the response, e.g. E1.
  string id = 1;
  // cii | advisory | sanctions | resilience | resilience-dimension | energy |
  // chokepoint | market | forecast
  string kind = 2;
  // Human-readable label, e.g. Country Instability Index.
  string label = 3;
  // Display value, e.g. 27 of 100 (Low).
  string value = 4;
  // The exact sentence claims citing this item are validated against.
  string fact_text = 5;
  // When the value was observed, ISO 8601.
  string as_of = 6;
  // Public https link for the value, when one exists.
  string url = 7;
}

// GetCountryIntelBriefResponse contains an AI-generated intelligence brief for a country.
message GetCountryIntelBriefResponse {
  // ISO 3166-1 alpha-2 country code.
  string country_code = 1;
  // Country name.
  string country_name = 2;
  // AI-generated intelligence brief text.
  string brief = 3;
  // AI model used for generation.
  string model = 4;
  // Brief generation time, as Unix epoch milliseconds.
  int64 generated_at = 5 [(sebuf.http.int64_encoding) = INT64_ENCODING_NUMBER];
  // Source articles used to ground the generated brief.
  repeated BriefSource sources = 6;
  // Structured sections of an English evidence-grounded brief. Empty for
  // non-English briefs, which carry text only.
  repeated BriefSection sections = 7;
  // World Monitor data points cited by at least one claim.
  repeated BriefEvidence evidence = 8;
}
